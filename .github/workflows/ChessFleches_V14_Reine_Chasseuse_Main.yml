              '  private static Chess.Move find(List<Chess.Move> legal,String uci){',
              '''            private static final class RootResult {
                String bestmove;Candidate bestScore;
                RootResult(String uci,Candidate score){bestmove=uci;bestScore=score;}
              }
              /** One short, fully drained UCI search. Optional root restriction is applied
               * only to safe legal queen moves, never to the opponent's replies. */
              private RootResult rootSearch(Chess.Board board,List<Chess.Move> restriction,int millis) throws Exception {
                command("position fen "+board.fen());
                StringBuilder go=new StringBuilder("go movetime ").append(millis);
                if(restriction!=null){
                  if(restriction.isEmpty())return null;
                  go.append(" searchmoves");
                  for(Chess.Move m:restriction)go.append(' ').append(Chess.uci(m));
                }
                command(go.toString());
                Map<Integer,Candidate> info=new HashMap<>();String best=null;
                long deadline=System.nanoTime()+700_000_000L;
                while(System.nanoTime()<deadline&&ready()){
                  if(reader.ready()){
                    String line=reader.readLine();if(line==null)break;
                    if(line.startsWith("info "))parseInfo(line,info);
                    else if(line.startsWith("bestmove ")){
                      String[] tokens=line.trim().split("\\s+");
                      if(tokens.length>1)best=tokens[1];
                      break;
                    }
                  }else Thread.sleep(2);
                }
                if(best==null){
                  command("stop");String late=readUntil("bestmove ",220);
                  if(late!=null){String[] parts=late.trim().split("\\s+");if(parts.length>1)best=parts[1];}
                }
                return best==null?null:new RootResult(best,info.get(1));
              }
              /** One baseline search + one short queen-only search, around 0.2s total.
               * If queen play is tactically inferior, use the ordinary best move. */
              private List<TacticalEngine.Suggestion> queenAttack(Chess.Board board,List<Chess.Move> legal){
                Chess.Move book=QueenRaid.opening(board,legal);
                if(book!=null)return Collections.singletonList(new TacticalEngine.Suggestion(book,0,StyleMode.REINE_CHASSEUSE));
                if(!ensureReady())return Collections.emptyList();
                try{
                  if(multiPV!=1){command("setoption name MultiPV value 1");multiPV=1;}
                  RootResult standard=rootSearch(board,null,75);
                  if(standard==null){lastError="Recherche dame indisponible";return Collections.emptyList();}
                  Chess.Move selected=find(legal,standard.bestmove);
                  if(selected==null){lastError="Coup moteur non légal";return Collections.emptyList();}
                  List<Chess.Move> candidates=QueenRaid.queenMoves(board,legal);
                  if(!candidates.isEmpty()){
                    List<Chess.Move> pawnCaptures=QueenRaid.pawnCaptures(board,candidates);
                    // Captures by the queen are the priority; otherwise search all safe queen moves.
                    List<Chess.Move> target=pawnCaptures.isEmpty()?candidates:pawnCaptures;
                    RootResult queen=rootSearch(board,target,95);
                    if(queen!=null && queen.bestScore!=null && standard.bestScore!=null){
                      Chess.Move move=find(target,queen.bestmove);
                      int drop=standard.bestScore.score-queen.bestScore.score;
                      int maximumDrop=!pawnCaptures.isEmpty()?145:board.fullmove<=6?135:85;
                      if(move!=null && drop<=maximumDrop)selected=move;
                    }
                  }
                  lastError="";
                  return Collections.singletonList(new TacticalEngine.Suggestion(selected,0,StyleMode.REINE_CHASSEUSE));
                }catch(Exception ex){lastError=ex.getClass().getSimpleName()+": "+ex.getMessage();close();return Collections.emptyList();}
              }
              private static Chess.Move find(List<Chess.Move> legal,String uci){''',
              'queen-limited safe Stockfish search')
