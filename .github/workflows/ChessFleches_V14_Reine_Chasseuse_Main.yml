            public static Chess.Move detect(Chess.Board before, boolean[] occupied, boolean[] highlighted) {
              if(before==null||occupied==null||occupied.length!=64||highlighted==null||highlighted.length!=64)return null;
              final char king=before.whiteTurn?'K':'k';
              int from=-1;
              for(int i=0;i<64;i++)if(before.b[i]==king){from=i;break;}
