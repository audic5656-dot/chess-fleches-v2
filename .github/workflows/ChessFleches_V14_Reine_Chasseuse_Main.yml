          package fr.chessfleches;

          import java.util.ArrayList;
          import java.util.List;

          /** Optional queen-first training style. Only provides legal, non-hanging queen moves.
           *  It cannot force the opponent to leave pawns undefended. */
          public final class QueenRaid {
            private QueenRaid() {}
            private static Chess.Move byUci(List<Chess.Move> legal,String uci){
              for(Chess.Move m:legal)if(Chess.uci(m).equals(uci))return m;
              return null;
            }
            public static boolean safe(Chess.Board board,Chess.Move m){
              if(m==null||Character.toLowerCase(board.b[m.from])!='q')return false;
              Chess.Board after=Chess.move(board,m);
              // A queen on an attacked square is not considered a free pawn pickup.
              // An immediate forced checkmate is the exception.
              return !Chess.squareAttacked(after,m.to,!board.whiteTurn)||
                     (Chess.inCheck(after,after.whiteTurn)&&Chess.legal(after).isEmpty());
            }
            public static List<Chess.Move> queenMoves(Chess.Board board,List<Chess.Move> legal){
              List<Chess.Move> safe=new ArrayList<>();
              for(Chess.Move m:legal)if(safe(board,m))safe.add(m);
              return safe;
            }
            public static List<Chess.Move> pawnCaptures(Chess.Board board,List<Chess.Move> legal){
              List<Chess.Move> pawns=new ArrayList<>();
              for(Chess.Move m:legal)if(Character.toLowerCase(board.b[m.to])=='p')pawns.add(m);
              return pawns;
            }
            /** White: early Qh5 attack. Black: Scandinavian Qxd5 when white captures.
             *  All moves are checked against actual board state and king safety. */
            public static Chess.Move opening(Chess.Board board,List<Chess.Move> legal){
              if(board==null||board.fullmove>4)return null;
              if(board.whiteTurn){
                if(board.fullmove==1&&board.b[59]=='Q'&&board.b[52]=='P'&&board.b[36]=='.'){
                  Chess.Move e4=byUci(legal,"e2e4");
                  if(e4!=null)return e4;
                }
                if(board.b[59]=='Q'&&board.b[36]=='P'){
                  Chess.Move h5=byUci(legal,"d1h5");
                  if(safe(board,h5))return h5;
                }
              }else if(board.b[3]=='q'){
                if(board.b[27]=='P'){
                  Chess.Move take=byUci(legal,"d8d5");
                  if(safe(board,take))return take;
                }
                if(board.fullmove==1&&board.b[11]=='p'){
                  Chess.Move d5=byUci(legal,"d7d5");
                  if(d5!=null&&board.b[36]=='P')return d5;
                  Chess.Move e5=byUci(legal,"e7e5");
                  if(e5!=null)return e5;
                }
                Chess.Move h4=byUci(legal,"d8h4");
                if(safe(board,h4))return h4;
              }
              return null;
            }
          }
