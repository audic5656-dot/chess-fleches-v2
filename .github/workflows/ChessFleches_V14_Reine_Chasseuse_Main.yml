          cat > ChessFleches/app/src/main/java/fr/chessfleches/StockfishEngine.java <<'JAVASTOCKFISH'
          package fr.chessfleches;

          import java.io.BufferedReader;
          import java.io.BufferedWriter;
          import java.io.InputStreamReader;
          import java.io.OutputStreamWriter;
          import java.io.File;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          /** V10 fast UCI engine + an optional forcing-play mode. One validated arrow only. */
          public final class StockfishEngine implements AutoCloseable {
            private final String executable;
            private Process process;
            private BufferedReader reader;
            private BufferedWriter writer;
            private String lastError="";
            private int multiPV=1;
            public StockfishEngine(String path){executable=path;}
            public synchronized String error(){return lastError;}
            public synchronized boolean ready(){return process!=null&&process.isAlive();}
            private void command(String msg) throws Exception {writer.write(msg);writer.write('\n');writer.flush();}
            private String readUntil(String prefix,long timeoutMs) throws Exception {
              long deadline=System.nanoTime()+timeoutMs*1_000_000L;
              while(System.nanoTime()<deadline&&process!=null&&process.isAlive()){
                if(reader.ready()){
                  String line=reader.readLine();if(line==null)break;
                  if(line.contains("CRITICAL ERROR"))throw new IllegalArgumentException("Position refusée par Stockfish");
                  if(line.startsWith(prefix))return line;
                }else Thread.sleep(3);
              }
              return null;
            }
            private synchronized boolean ensureReady(){
              if(ready())return true;
              close();lastError="";
              try{
                File binary=new File(executable);
                if(!binary.isFile())throw new IllegalStateException("Binaire moteur introuvable");
                process=new ProcessBuilder(executable).redirectErrorStream(true).start();
                reader=new BufferedReader(new InputStreamReader(process.getInputStream(),StandardCharsets.UTF_8));
                writer=new BufferedWriter(new OutputStreamWriter(process.getOutputStream(),StandardCharsets.UTF_8));
                command("uci");if(readUntil("uciok",5000)==null)throw new IllegalStateException("Moteur UCI sans réponse");
                command("setoption name Threads value 1");
                command("setoption name Hash value 16");
                command("setoption name MultiPV value 1");multiPV=1;
                command("isready");if(readUntil("readyok",5000)==null)throw new IllegalStateException("Moteur non prêt");
                return true;
              }catch(Exception ex){lastError=ex.getClass().getSimpleName()+": "+ex.getMessage();close();return false;}
            }
            public void warmup(){ensureReady();}
            private static final class Candidate {
              String uci;int score,depth;boolean mate;
              Candidate(String u,int s,int d,boolean m){uci=u;score=s;depth=d;mate=m;}
            }
            private static Candidate parseInfo(String line,Map<Integer,Candidate> results){
              if(!line.startsWith("info ")||!line.contains(" pv ")||!line.contains(" score "))return null;
              String[] t=line.trim().split("\\s+");
              int pv=1,depth=-1,score=0;boolean scored=false,mate=false;String uci=null;
              try {
                for(int i=1;i<t.length;i++){
                  if("depth".equals(t[i])&&i+1<t.length)depth=Integer.parseInt(t[i+1]);
                  else if("multipv".equals(t[i])&&i+1<t.length)pv=Integer.parseInt(t[i+1]);
                  else if("score".equals(t[i])&&i+2<t.length){
                    if("cp".equals(t[i+1])){score=Integer.parseInt(t[i+2]);scored=true;}
                    else if("mate".equals(t[i+1])){
                      int ply=Integer.parseInt(t[i+2]);
                      score=ply>0?29000-Math.min(200,ply)*100:-29000+Math.min(200,-ply)*100;
                      scored=true;mate=true;
                    }
                  } else if("pv".equals(t[i])&&i+1<t.length){uci=t[i+1];break;}
                }
              } catch(NumberFormatException ignored){return null;}
              if(!scored||uci==null||depth<0||pv<1||pv>5)return null;
              Candidate c=new Candidate(uci,score,depth,mate);
              Candidate previous=results.get(pv);
              if(previous==null||depth>=previous.depth)results.put(pv,c);
              return c;
            }
            private static Chess.Move find(List<Chess.Move> legal,String uci){
              if(uci==null)return null;
              for(Chess.Move m:legal)if(Chess.uci(m).equalsIgnoreCase(uci))return m;
              return null;
            }
            /** Practical aggression only for moves within 0.55 pawn of Stockfish's best evaluation. */
            private static int tacticalScore(Chess.Board board,Chess.Move m){
              Chess.Board after=Chess.move(board,m);
              int score=0;
              if(Chess.inCheck(after,after.whiteTurn))score+=40;
              if(m.promotion!='.')score+=35;
              if(m.castle)score+=8;
              if(board.b[m.to]!='.')score+=Math.min(12,Chess.pieceValue(board.b[m.to])/50);
              int enemyKing=-1;
              char enemy=board.whiteTurn?'k':'K';
              for(int i=0;i<64;i++)if(board.b[i]==enemy){enemyKing=i;break;}
              if(enemyKing>=0){
                int distance=Math.abs(Chess.row(m.to)-Chess.row(enemyKing))+
                             Math.abs(Chess.col(m.to)-Chess.col(enemyKing));
                char piece=Character.toLowerCase(board.b[m.from]);
                if(piece=='n'||piece=='b'||piece=='r'||piece=='q')score+=Math.max(0,10-distance)*2;
              }
              return score;
            }
            private static Chess.Move chooseTrapMove(Chess.Board board,List<Chess.Move> legal,
                                                    String bestmove,Map<Integer,Candidate> variations){
              Chess.Move fallback=find(legal,bestmove);
              if(fallback==null)return null;
              Candidate strongest=variations.get(1);
              if(strongest==null||strongest.mate&&strongest.score>0)return fallback;
              int threshold=strongest.score-55;
              int preferred=Integer.MIN_VALUE;Chess.Move choice=fallback;
              for(Candidate c:variations.values()){
                Chess.Move m=find(legal,c.uci);
                if(m==null||c.score<threshold||c.mate&&c.score<0)continue;
                int value=c.score-strongest.score+tacticalScore(board,m);
                if(value>preferred){preferred=value;choice=m;}
              }
              return choice;
            }
            public synchronized List<TacticalEngine.Suggestion> analyze(Chess.Board board,List<StyleMode> styles,
                int arrows,int timeMs,int depth){
              if(board==null||!Chess.plausible(board)||Chess.inCheck(board,!board.whiteTurn))return Collections.emptyList();
              List<Chess.Move> legal=Chess.legal(board);
              if(legal.isEmpty())return Collections.emptyList();
              boolean traps=styles!=null&&styles.contains(StyleMode.PIEGEUR_FOU);
              // The gambit is an *explicit* risky opening choice. It can fail against best defence.
              if(traps){
                Chess.Move book=AlienGambit.suggest(board,legal);
                if(book!=null)return Collections.singletonList(new TacticalEngine.Suggestion(book,0,StyleMode.PIEGEUR_FOU));
              }
              if(!ensureReady())return Collections.emptyList();
              try{
                int requested=traps?3:1;
                if(requested!=multiPV){command("setoption name MultiPV value "+requested);multiPV=requested;}
                command("position fen "+board.fen());
                command("go movetime "+(traps?110:85));
                String bestmove=null;
                Map<Integer,Candidate> variations=new HashMap<>();
                long deadline=System.nanoTime()+850_000_000L;
                while(System.nanoTime()<deadline&&ready()){
                  if(reader.ready()){
                    String line=reader.readLine();if(line==null)break;
                    if(line.startsWith("info "))parseInfo(line,variations);
                    else if(line.startsWith("bestmove ")){String[] t=line.trim().split("\\s+");if(t.length>1)bestmove=t[1];break;}
                  } else Thread.sleep(2);
                }
                if(bestmove==null){
                  command("stop");String line=readUntil("bestmove ",250);
                  if(line!=null){String[] t=line.trim().split("\\s+");if(t.length>1)bestmove=t[1];}
                }
                if(bestmove==null){lastError="Moteur trop lent";close();return Collections.emptyList();}
                Chess.Move selected=traps?chooseTrapMove(board,legal,bestmove,variations):find(legal,bestmove);
                if(selected==null){lastError="Coup moteur non légal";return Collections.emptyList();}
                lastError="";
                return Collections.singletonList(new TacticalEngine.Suggestion(selected,0,
                  traps?StyleMode.PIEGEUR_FOU:StyleMode.FOU));
              }catch(Exception ex){lastError=ex.getClass().getSimpleName()+": "+ex.getMessage();close();return Collections.emptyList();}
            }
            @Override public synchronized void close(){
              if(process!=null)try{process.destroyForcibly();}catch(Exception ignored){}
              process=null;reader=null;writer=null;multiPV=1;
            }
