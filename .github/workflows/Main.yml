name: Compiler Chess Fleches V9 automatique Stockfish Patricia
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  construire-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK officiel
        shell: bash
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      - name: Decompresser le projet
        run: unzip -q ChessFleches_v2_Projet_GitHub.zip

      - name: Corriger le cadre vert et les fleches
        shell: bash
        run: |
          python3 - <<'PYFIX'
          #!/usr/bin/env python3
          """Chess Flèches: fix chessboard validation, overlay offset and stale arrows."""
          from pathlib import Path
          
          src = Path('ChessFleches/app/src/main/java/fr/chessfleches')
          
          def read(name):
              return (src / name).read_text(encoding='utf-8')
          
          def write(name, data):
              (src / name).write_text(data, encoding='utf-8')
          
          def once(data, old, new, name):
              if data.count(old) != 1:
                  raise RuntimeError('Expected one patch anchor in '+name+': '+repr(old[:80]))
              return data.replace(old, new, 1)
          
          v = read('BoardVision.java')
          start = v.index('  private Box fullWidth(Bitmap image){')
          end = v.index('  public Box detectOnScreen(Bitmap image){', start)
          v = v[:start] + '''
            private static double boardColorDistance(int color,double[] bg){
              double r=channel(color,16)-bg[0],g=channel(color,8)-bg[1],b=channel(color,0)-bg[2];
              return Math.sqrt((r*r+g*g+b*b)/3.0);
            }
            /** Only accept a real, correctly aligned 8x8 Chess Universe checkerboard. */
            private static int matchingSquares(Bitmap image,int y,int size){
              int matches=0;
              double sq=size/8.0;
              double[][] corners={{.16,.18},{.84,.18},{.16,.82},{.84,.82}};
              for(int r=0;r<8;r++)for(int c=0;c<8;c++){
                int close=0;
                double[] bg=BG[(r+c)&1];
                for(double[] pt:corners){
                  int x=(int)Math.round((c+pt[0])*sq);
                  int yy=(int)Math.round(y+(r+pt[1])*sq);
                  if(boardColorDistance(pixel(image,x,yy),bg)<44)close++;
                }
                if(close>=3)matches++;
              }
              return matches;
            }
            private Box fullWidth(Bitmap image){
              int w=image.getWidth(),h=image.getHeight();
              if(w<280||h<w+8)return null;
              int size=w,hi=h-size;
              double best=-1;int bestY=-1;
              int[] xs=new int[8];
              for(int c=0;c<8;c++)xs[c]=(int)((c+.14)*size/8);
              for(int y=0;y<=hi;y+=2){
                if(matchingSquares(image,y,size)<52)continue;
                double score=0;
                for(int r=0;r<=8;r++){
                  int yy=y+(int)(r*size/8.0);
                  for(int c=0;c<8;c++)
                    score+=diff(pixel(image,xs[c],yy-2),pixel(image,xs[c],yy+2));
                }
                if(score>best){best=score;bestY=y;}
              }
              return best>1300?new Box(0,bestY,size):null;
            }
          ''' + v[end:]
          v = once(v, '  public Box board(){return board;}',
                   '  public Box board(){return board;}\n  public void align(Box visible){if(visible!=null)board=visible;}',
                   'BoardVision.java')
          v = once(v, '    Box value=fullWidth(small);\n    if(small!=image)small.recycle();',
                   '    Box value=fullWidth(small);\n    int smallHeight=small.getHeight();\n    if(small!=image)small.recycle();',
                   'BoardVision.java')
          v = once(v, '    return new Box(0,(int)Math.round(value.y*(h/(double)(h/scale))),w);',
                   '    return new Box(0,(int)Math.round(value.y*(h/(double)smallHeight)),w);',
                   'BoardVision.java')
          write('BoardVision.java', v)
          
          c = read('CaptureService.java')
          c = once(c, '  private void process(Bitmap image){\n    if(!vision.calibrated()){', '''  private void process(Bitmap image){
              BoardVision.Box visible=vision.detectOnScreen(image);
              if(visible==null){
                vision.reset();game=null;scanPending="";scanSame=0;
                pending="";same=0;analyzed="";arrows.clear();
                overlay.show(null,new ArrayList<>(),white);
                overlay.status("Aucun echiquier detecte");
                return;
              }
              if(!vision.calibrated()){''', 'CaptureService.java')
          c = once(c, '      BoardVision.Box rect=vision.detectOnScreen(image);',
                   '      BoardVision.Box rect=visible;', 'CaptureService.java')
          c = once(c, '    }else{\n      Chess.Move next=vision.detectMove(image,game,white);',
                   '    }else{\n      vision.align(visible);\n      Chess.Move next=vision.detectMove(image,game,white);',
                   'CaptureService.java')
          write('CaptureService.java', c)
          
          o = read('OverlayUI.java')
          o = once(o, '      int n=Math.min(5,suggestions.size());float sz=board.size/8f;', '''      // Convert MediaProjection physical-screen pixels to overlay-view pixels.
                int[] screenOrigin=new int[2];
                getLocationOnScreen(screenOrigin);
                float left=board.x-screenOrigin[0],top=board.y-screenOrigin[1];
                int n=Math.min(5,suggestions.size());float sz=board.size/8f;''', 'OverlayUI.java')
          o = once(o, '        float x=board.x+(fromC+.5f)*sz,y=board.y+(fromR+.5f)*sz;',
                   '        float x=left+(fromC+.5f)*sz,y=top+(fromR+.5f)*sz;', 'OverlayUI.java')
          o = once(o, '        float tx=board.x+(toC+.5f)*sz,ty=board.y+(toR+.5f)*sz;',
                   '        float tx=left+(toC+.5f)*sz,ty=top+(toR+.5f)*sz;', 'OverlayUI.java')
          o = once(o, '      canvas.drawRect(new RectF(board.x,board.y,board.x+board.size,board.y+board.size),p);',
                   '      canvas.drawRect(new RectF(left,top,left+board.size,top+board.size),p);', 'OverlayUI.java')
          write('OverlayUI.java', o)
          print('Patch Chess Flèches appliqué avec succès')
          PYFIX

      - name: Aligner la reconnaissance et garder les coups legaux (V5)
        shell: bash
        run: |
          python3 - <<'PYV5'
          from pathlib import Path
          src = Path('ChessFleches/app/src/main/java/fr/chessfleches')
          p=src/'BoardVision.java'
          s=p.read_text(encoding='utf-8')
          start=s.index('  /** Réconstruit les pièces depuis l\'image')
          end=s.index('  /** Apprentissage de ce qui est reconnu', start)
          replacement='''  /** Test a precise board offset. Reject malformed positions instead of guessing. */
            private static final class VisionCandidate {
              final Box box;
              final Chess.Board game;
              final double loss;
              VisionCandidate(Box rect,Chess.Board position,double value){box=rect;game=position;loss=value;}
            }
            private VisionCandidate classifyAt(Bitmap image,Box rect,boolean whiteBottom,boolean whiteToMove){
              board=rect;
              double[][] scores=readCosts(image);
              Chess.Board found=new Chess.Board();found.whiteTurn=whiteToMove;
              found.rights=0;found.ep=-1;
              double total=0;
              int unsure=0;
              for(int r=0;r<8;r++)for(int c=0;c<8;c++){
                double[] values=scores[r*8+c];
                int best=0;double score=values[0],second=Double.POSITIVE_INFINITY;
                for(int k=1;k<values.length;k++){
                  if(values[k]<score){second=score;score=values[k];best=k;}
                  else if(values[k]<second)second=values[k];
                }
                if(best>0&&score>2.70){best=0;unsure+=2;}
                if(best>0&&second-score<.08)unsure++;
                // Prefer sharp silhouette matches and the alignment with the least error.
                total+=score;
                found.b[internal(r,c,whiteBottom)]=TYPES[best];
              }
              if(unsure>9||!Chess.plausible(found))return null;
              return new VisionCandidate(rect,found,total+2*unsure);
            }
            /** Refine an 8x8 frame by a few physical pixels, including odd offsets.
             *  The V3 detector rounds to a scaled even row and can be two pixels off. */
            public Chess.Board scanPosition(Bitmap image,Box rect,boolean whiteBottom,boolean whiteToMove){
              if(rect==null)return null;
              VisionCandidate best=null;
              final int reach=Math.max(6,rect.size/150);
              for(int dy=-reach;dy<=reach;dy++){
                int yy=rect.y+dy;
                if(yy<0||yy+rect.size>image.getHeight())continue;
                VisionCandidate trial=classifyAt(image,new Box(rect.x,yy,rect.size),whiteBottom,whiteToMove);
                if(trial!=null&&(best==null||trial.loss<best.loss))best=trial;
              }
              if(best==null){board=null;alignmentOffset=0;return null;}
              board=best.box;
              alignmentOffset=best.box.y-rect.y;
              return best.game;
            }
          '''
          s=s[:start]+replacement+s[end:]
          old='  private Box board;'
          assert s.count(old)==1,(old,s.count(old))
          s=s.replace(old,old+'\n  private int alignmentOffset=0;',1)
          old='  public void reset(){board=null;ready=false;'
          assert s.count(old)==1,(old,s.count(old))
          s=s.replace(old,'  public void reset(){board=null;alignmentOffset=0;ready=false;',1)
          old='  public void align(Box visible){if(visible!=null)board=visible;}'
          assert s.count(old)==1,(old,s.count(old))
          s=s.replace(old,'  public void align(Box visible){if(visible!=null)board=new Box(visible.x,visible.y+alignmentOffset,visible.size);}',1)
          old='    board=rect;ready=true;'
          assert s.count(old)==1,(old,s.count(old))
          s=s.replace(old,'    board=new Box(rect.x,rect.y+alignmentOffset,rect.size);ready=true;',1)
          p.write_text(s,encoding='utf-8')
          print('V5: scan alignment corrected, retains board offset and validates kings')
          PYV5

      - name: Synchronisation visuelle anti-coups-impossibles V6
        shell: bash
        run: |
          python3 - <<'PYV6'
          from pathlib import Path
          root=Path('ChessFleches/app/src/main/java/fr/chessfleches')
          
          def once(data,old,new,where):
              if data.count(old)!=1: raise ValueError(f'Expected 1 anchor {where}, got {data.count(old)}: {old[:80]!r}')
              return data.replace(old,new,1)
          
          vfile=root/'BoardVision.java';s=vfile.read_text(encoding='utf-8')
          new_methods='''  /** Independent silhouette test; ignores last-move square background colour. */
            private boolean visiblyOccupied(Bitmap image,Box rect,int r,int c){
              double sq=rect.size/8.0;
              int[] red=new int[4],green=new int[4],blue=new int[4];
              double[] pts={.07,.93};int k=0;
              for(double vy:pts)for(double vx:pts){
                int x=(int)Math.round(rect.x+(c+vx)*sq);
                int y=(int)Math.round(rect.y+(r+vy)*sq);
                int color=pixel(image,x,y);
                red[k]=channel(color,16);green[k]=channel(color,8);blue[k]=channel(color,0);k++;
              }
              java.util.Arrays.sort(red);java.util.Arrays.sort(green);java.util.Arrays.sort(blue);
              double bgR=(red[1]+red[2])/2.0,bgG=(green[1]+green[2])/2.0,bgB=(blue[1]+blue[2])/2.0;
              int pixels=0;
              final int n=12;
              for(int yy=0;yy<n;yy++)for(int xx=0;xx<n;xx++){
                double vx=.20+.60*(xx+.5)/n,vy=.20+.60*(yy+.5)/n;
                int x=(int)Math.round(rect.x+(c+vx)*sq);
                int y=(int)Math.round(rect.y+(r+vy)*sq);
                int color=pixel(image,x,y);
                double dr=channel(color,16)-bgR,dg=channel(color,8)-bgG,db=channel(color,0)-bgB;
                if((dr*dr+dg*dg+db*db)/3.0>48.0*48.0)pixels++;
              }
              return pixels>=16;
            }
            /** Only trust the engine when the actual pixels agree with the saved board. */
            public boolean positionMatches(Bitmap image,Chess.Board expected,boolean whiteBottom){
              if(image==null||board==null||expected==null)return false;
              double[][] scores=readCosts(image);
              if(scores==null)return false;
              for(int r=0;r<8;r++)for(int c=0;c<8;c++){
                char predicted=expected.b[internal(r,c,whiteBottom)];
                boolean occupied=visiblyOccupied(image,board,r,c);
                if(occupied!=(predicted!='.'))return false;
                if(occupied){
                  double[] rowScores=scores[r*8+c];
                  int target=typeIndex(predicted),best=1;
                  for(int i=2;i<rowScores.length;i++)if(rowScores[i]<rowScores[best])best=i;
                  // A clear different piece is evidence that the game state has drifted.
                  if(best!=target&&rowScores[target]-rowScores[best]>1.3&&rowScores[best]<2.2)return false;
                }
              }
              return true;
            }
          '''
          s=once(s,'  /** Apprentissage de ce qui est reconnu',new_methods+'  /** Apprentissage de ce qui est reconnu','vision-methods')
          s=once(s,'      if(best>0&&second-score<.08)unsure++;','      if(best>0&&second-score<.08)unsure++;\n                if((best!=0)!=visiblyOccupied(image,rect,r,c))return null;','vision-scan')
          s=once(s,'learned[i].add(feature(image,rect,r,c));','learned[i].add(feature(image,board,r,c));','vision-learning')
          vfile.write_text(s,encoding='utf-8')
          
          cfile=root/'CaptureService.java';c=cfile.read_text(encoding='utf-8')
          c=once(c,'private int same=0,scanSame=0,frames=0;', 'private int same=0,scanSame=0,frames=0,lostFrames=0;','capture-decl')
          c=once(c,'same=0;frames=0;analyzed="";', 'same=0;frames=0;lostFrames=0;analyzed="";','capture-reset')
          needle='''      game=scanned;vision.calibrate(image,rect,game,white);
                overlay.status("Position reconnue ✓ · "+(game.whiteTurn?"Blancs":"Noirs")+" au trait");'''
          repl='''      game=scanned;vision.calibrate(image,rect,game,white);
                if(!vision.positionMatches(image,game,white)){
                  vision.reset();game=null;scanSame=0;analyzed="";arrows.clear();
                  overlay.show(null,new ArrayList<>(),white);
                  overlay.status("Pieces mal reconnues · nouvelle lecture");
                  return;
                }
                lostFrames=0;
                overlay.status("Position reconnue ✓ · "+(game.whiteTurn?"Blancs":"Noirs")+" au trait");'''
          c=once(c,needle,repl,'capture-initial-check')
          old='''    }else{
                vision.align(visible);
                Chess.Move next=vision.detectMove(image,game,white);
                if(next==null){pending="";same=0;}
                else if(Chess.uci(next).equals(pending)){
                  if(++same>=2){game=Chess.move(game,next);same=0;pending="";analyzed="";}
                }else{pending=Chess.uci(next);same=1;}
              }
          '''
          new='''    }else{
                vision.align(visible);
                if(!vision.positionMatches(image,game,white)){
                  // Never show a move for a stale or visually contradictory game state.
                  arrows.clear();analyzed="";
                  Chess.Move next=vision.detectMove(image,game,white);
                  Chess.Board after=next==null?null:Chess.move(game,next);
                  if(after!=null&&vision.positionMatches(image,after,white)){
                    lostFrames=0;
                    String uci=Chess.uci(next);
                    if(uci.equals(pending))same++;else{pending=uci;same=1;}
                    if(same>=2){game=after;pending="";same=0;}
                    overlay.show(vision.board(),new ArrayList<>(),white);
                    overlay.status("Verification du coup · analyse actualisee");
                    return;
                  }
                  pending="";same=0;
                  overlay.show(vision.board(),new ArrayList<>(),white);
                  overlay.status("Position differente · resynchronisation");
                  if(++lostFrames>=3)resetSession();
                  return;
                }
                lostFrames=0;pending="";same=0;
              }
          '''
          c=once(c,old,new,'capture-live-sync')
          cfile.write_text(c,encoding='utf-8')
          print('Applied V6 safety patch')
          PYV6

      - name: Limiter la latence et les sacrifices gratuits (V7)
        shell: bash
        run: |
          python3 - <<'PYV7'
          from pathlib import Path
          root = Path('ChessFleches/app/src/main/java/fr/chessfleches')
          
          def once(data, old, new, label):
              n=data.count(old)
              if n!=1: raise ValueError(f'{label}: expected one anchor, got {n}')
              return data.replace(old,new,1)
          
          # Shorten the engine budget. The previous 5/5 setting could spend 2.4s per search
          # on the main capture loop, not counting image work.
          cfile=root/'CaptureService.java'
          c=cfile.read_text(encoding='utf-8')
          c=once(c,'engine.analyze(game,styles,count,effort*480,effort)',
                 'engine.analyze(game,styles,count,Math.min(600,Math.max(250,effort*150)),effort)',
                 'analysis time limit')
          cfile.write_text(c,encoding='utf-8')
          
          # Eliminate the "sacrifice for style" incentive. Only choose within a small,
          # search-evaluated margin of the best move; mate scores still win.
          p=root/'TacticalEngine.java';s=p.read_text(encoding='utf-8')
          s=once(s,'(++nodes&255)==0','(++nodes&31)==0','time-check frequency')
          s=once(s,'    int score=e.base;boolean check=Chess.inCheck(after,after.whiteTurn);', '''    // No chosen style can override a clearly worse tactical evaluation.
              // This is NOT a proof of soundness, only a guard against style-only blunders.
              if(e.base < best-35 && e.base < 28000)return -100000+e.base;
              int score=e.base;boolean check=Chess.inCheck(after,after.whiteTurn);''','best-move safety')
          start=s.index('      case FOU:\n')
          end=s.index('      case DEFENSIF:\n',start)
          s=s[:start]+'''      case FOU:
                  // Prefer forcing attacks, never REWARD an unsupported sacrifice.
                  score+=check?30:0;
                  score+=Math.min(25,captured/40)+center*2+Math.min(14,threats*3);
                  if(moverThreatened&&piece>=300&&captured<piece/2)score-=80;
                  break;
          '''+s[end:]
          p.write_text(s,encoding='utf-8')
          
          # Image verification currently extracts 64 classification vectors on EVERY frame.
          # Use a lightweight silhouette/occupancy match for known tracked positions,
          # and reserve full piece classification for initial scan/re-synchronisation.
          p=root/'BoardVision.java';s=p.read_text(encoding='utf-8')
          start=s.index('  /** Only trust the engine when the actual pixels agree with the saved board. */')
          end=s.index('  /** Apprentissage de ce qui est reconnu',start)
          s=s[:start]+'''  /** Fast verification: stop rather than displaying arrows for moved/missing pieces. */
            public boolean positionMatches(Bitmap image,Chess.Board expected,boolean whiteBottom){
              if(image==null||board==null||expected==null||image.getWidth()!=board.size)return false;
              for(int r=0;r<8;r++)for(int c=0;c<8;c++){
                boolean expectedOccupied=expected.b[internal(r,c,whiteBottom)]!='.';
                if(visiblyOccupied(image,board,r,c)!=expectedOccupied)return false;
              }
              return true;
            }
          '''+s[end:]
          # Fast path to avoid the expensive full-height repeated scan on stable frames.
          s=once(s,'  public Box detectOnScreen(Bitmap image){','''  public Box detectOnScreen(Bitmap image){
              if(ready && board!=null && image!=null && board.size==image.getWidth()){
                int y=board.y-alignmentOffset;
                if(y>=0 && y+board.size<=image.getHeight() &&
                   matchingSquares(image,y,board.size)>=52)
                   return new Box(0,y,board.size);
              }''','fast board location')
          p.write_text(s,encoding='utf-8')
          print('V7 speed/playing-style guard applied')
          PYV7

      - name: Installer Stockfish 19 ARM64 officiel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz" \
            -o "$RUNNER_TEMP/stockfish19.tar.gz"
          mkdir -p "$RUNNER_TEMP/stockfish19" ChessFleches/app/src/main/jniLibs/arm64-v8a ChessFleches/app/src/main/assets
          tar xzf "$RUNNER_TEMP/stockfish19.tar.gz" -C "$RUNNER_TEMP/stockfish19"
          ENGINE=""
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -Eq 'ELF.*(aarch64|ARM aarch64)'; then
              ENGINE="$candidate"
              break
            fi
          done < <(find "$RUNNER_TEMP/stockfish19" -type f -print0)
          if [ -z "$ENGINE" ]; then
            echo 'Stockfish 19 ARM64 executable not found in official archive'; exit 1
          fi
          cp "$ENGINE" ChessFleches/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 ChessFleches/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          curl -fLsS https://raw.githubusercontent.com/official-stockfish/Stockfish/sf_19/Copying.txt -o ChessFleches/app/src/main/assets/stockfish_GPLv3.txt || \
            curl -fLsS https://raw.githubusercontent.com/official-stockfish/Stockfish/sf_19/COPYING -o ChessFleches/app/src/main/assets/stockfish_GPLv3.txt
          printf 'Stockfish 19 is GNU GPLv3 software. Exact official source: https://github.com/official-stockfish/Stockfish/tree/sf_19\n' > ChessFleches/app/src/main/assets/stockfish_source.txt
          file ChessFleches/app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Installer Patricia 5.1 ARM64 (optionnel)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patricia51" ChessFleches/app/src/main/jniLibs/arm64-v8a
          # SourceForge portable Android ARM64 package; Stockfish remains the fallback.
          if ! curl -fL --retry 2 --connect-timeout 15 --max-time 120 \
            "https://downloads.sourceforge.net/project/chess-engines-for-android/Patricia_5.1.zip" \
            -o "$RUNNER_TEMP/patricia51.zip"; then
            echo 'Patricia 5.1 download unavailable: continuing with Stockfish 19'
            exit 0
          fi
          if ! unzip -q "$RUNNER_TEMP/patricia51.zip" -d "$RUNNER_TEMP/patricia51"; then
            echo 'Patricia 5.1 package unreadable: continuing with Stockfish 19'
            exit 0
          fi
          PATRICIA=''
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -Eq 'ELF.*(aarch64|ARM aarch64)'; then
              case "$(printf %s "$candidate" | tr '[:upper:]' '[:lower:]')" in
                *arm64-v8a*|*arm64*) PATRICIA="$candidate"; break ;;
              esac
            fi
          done < <(find "$RUNNER_TEMP/patricia51" -type f -print0)
          if [ -n "$PATRICIA" ]; then
            cp "$PATRICIA" ChessFleches/app/src/main/jniLibs/arm64-v8a/libpatricia.so
            chmod 755 ChessFleches/app/src/main/jniLibs/arm64-v8a/libpatricia.so
            echo 'Patricia 5.1 ARM64 binary packaged'
          else
            echo 'No suitable Patricia ARM64 executable, Stockfish 19 only'
          fi

      - name: Integrer le moteur et accelerer les fleches V8
        shell: bash
        run: |
          cat > /tmp/StockfishEngine.java <<'JAVAENGINE'
          package fr.chessfleches;
          
          import java.io.BufferedReader;
          import java.io.BufferedWriter;
          import java.io.InputStreamReader;
          import java.io.OutputStreamWriter;
          import java.nio.charset.StandardCharsets;
          import java.io.File;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          
          /** Persistent, local UCI Stockfish engine. Never supplies a move absent from Chess.legal(). */
          public final class StockfishEngine implements AutoCloseable {
            private final String executable;
            private Process process;
            private BufferedReader reader;
            private BufferedWriter writer;
            private String lastError="";
            private static final int THINK_MS=85;
            public StockfishEngine(String path){executable=path;}
            public synchronized String error(){return lastError;}
            public synchronized boolean ready(){return process!=null&&process.isAlive();}
          
            private void command(String msg) throws Exception {
              writer.write(msg);writer.write('\n');writer.flush();
            }
            private String readUntil(String prefix,long timeoutMs) throws Exception {
              long deadline=System.nanoTime()+timeoutMs*1_000_000L;
              while(System.nanoTime()<deadline && process!=null && process.isAlive()) {
                if(reader.ready()) {
                  String line=reader.readLine();
                  if(line==null)break;
                  if(line.contains("CRITICAL ERROR"))throw new IllegalArgumentException("Position refusée par Stockfish");
                  if(line.startsWith(prefix))return line;
                } else Thread.sleep(3);
              }
              return null;
            }
            private synchronized boolean ensureReady(){
              if(process!=null&&process.isAlive())return true;
              close();lastError="";
              try {
                File binary=new File(executable);
                if(!binary.isFile())throw new IllegalStateException("Binaire Stockfish introuvable");
                process=new ProcessBuilder(executable).redirectErrorStream(true).start();
                reader=new BufferedReader(new InputStreamReader(process.getInputStream(),StandardCharsets.UTF_8));
                writer=new BufferedWriter(new OutputStreamWriter(process.getOutputStream(),StandardCharsets.UTF_8));
                command("uci");
                if(readUntil("uciok",5000)==null)throw new IllegalStateException("Stockfish ne répond pas");
                command("setoption name Threads value 1");
                command("setoption name Hash value 16");
                command("setoption name MultiPV value 1");
                command("isready");
                if(readUntil("readyok",5000)==null)throw new IllegalStateException("Initialisation Stockfish impossible");
                return true;
              }catch(Exception ex){lastError=ex.getClass().getSimpleName()+": "+ex.getMessage();close();return false;}
            }
            public void warmup(){ensureReady();}
          
            public synchronized List<TacticalEngine.Suggestion> analyze(Chess.Board board,List<StyleMode> styles,
               int arrows,int timeMs,int depth){
              if(board==null||!Chess.plausible(board)||Chess.inCheck(board,!board.whiteTurn))return Collections.emptyList();
              List<Chess.Move> legal=Chess.legal(board);
              if(legal.isEmpty())return Collections.emptyList();
              if(!ensureReady())return Collections.emptyList();
              try {
                command("position fen "+board.fen());
                command("go movetime "+THINK_MS);
                String line=readUntil("bestmove ",800);
                if(line==null){command("stop");line=readUntil("bestmove ",300);}
                if(line==null){lastError="Délai de calcul dépassé";close();return Collections.emptyList();}
                String[] tokens=line.trim().split("\\s+");
                if(tokens.length<2)return Collections.emptyList();
                for(Chess.Move m:legal)if(Chess.uci(m).equalsIgnoreCase(tokens[1])){
                  lastError="";
                  return Collections.singletonList(new TacticalEngine.Suggestion(m,0,StyleMode.FOU));
                }
                lastError="Coup proposé non légal pour la position lue";
                return Collections.emptyList();
              }catch(Exception ex){lastError=ex.getClass().getSimpleName()+": "+ex.getMessage();close();return Collections.emptyList();}
            }
            @Override public synchronized void close(){
              if(process!=null){try{process.destroyForcibly();}catch(Exception ignored){}}
              process=null;reader=null;writer=null;
            }
          }
          JAVAENGINE
          cp /tmp/StockfishEngine.java ChessFleches/app/src/main/java/fr/chessfleches/StockfishEngine.java
          python3 - <<'PYV8'
          from pathlib import Path
          root=Path('ChessFleches/app/src/main/java/fr/chessfleches')
          
          def change(p,old,new,label):
              s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n!=1: raise ValueError(f'V8 {label}: expected 1 occurrence; got {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          
          # Stockfish official UCI engine replaces the local handcrafted evaluation.
          app=root/'CaptureService.java'
          change(app,'private BoardVision vision;private Chess.Board game;private TacticalEngine engine;',
                 'private BoardVision vision;private Chess.Board game;private StockfishEngine engine;', 'engine field')
          change(app,'vision=new BoardVision(this);engine=new TacticalEngine();game=Chess.initial();loadSettings();',
                 'vision=new BoardVision(this);engine=new StockfishEngine(getApplicationInfo().nativeLibraryDir+"/libstockfish.so");new Thread(()->engine.warmup(),"stockfish-init").start();game=Chess.initial();loadSettings();', 'initialization')
          change(app,'worker.postDelayed(this::sample,900);','worker.postDelayed(this::sample,120);','first sampling')
          change(app,'if(running)worker.postDelayed(this::sample,950);','if(running)worker.postDelayed(this::sample,65);','polling frequency')
          change(app,'    },160);','    },35);','overlay hiding delay')
          change(app,'      if(++frames%2!=0)return;','      if(++frames%2!=0)return;','scan path unchanged')
          change(app,'List<TacticalEngine.Suggestion> top=engine.analyze(game,styles,count,Math.min(600,Math.max(250,effort*150)),effort);',
                 'List<TacticalEngine.Suggestion> top=engine.analyze(game,styles,1,85,effort);','stockfish fast analysis')
          change(app,'    else overlay.status("À toi · "+Chess.uci(arrows.get(0).move)+" · "+arrows.get(0).style.shortName());',
                 '    else overlay.status("À toi · "+Chess.uci(arrows.get(0).move)+" · Stockfish 19");','status')
          change(app,'    if(arrows.isEmpty())overlay.status("Aucun coup légal trouvé");',
                 '    if(arrows.isEmpty())overlay.status("Pas de coup fiable · "+engine.error());','no silent fallback')
          change(app,'    if(thread!=null)thread.quitSafely();if(overlay!=null)overlay.close();super.onDestroy();',
                 '    if(engine!=null)engine.close();if(thread!=null)thread.quitSafely();if(overlay!=null)overlay.close();super.onDestroy();','cleanup')
          
          # Strictly one arrow, with validated move and no style bonuses.
          # Keep the old TacticalEngine class only for the Suggestion data model.
          
          # On Android 10+, executable from data files is blocked. A packaged nativeLibraryDir
          # path is executable, provided the binary is installed as an extracted legacy JNI lib.
          gradle=Path('ChessFleches/app/build.gradle')
          s=gradle.read_text(encoding='utf-8')
          if 'packagingOptions' not in s:
              s=s.replace('  compileOptions {','  packagingOptions { jniLibs { useLegacyPackaging true } }\n  compileOptions {',1)
          s=s.replace('versionCode 2; versionName \'0.2\'','versionCode 8; versionName \'0.8-stockfish19\'')
          gradle.write_text(s,encoding='utf-8')
          manifest=Path('ChessFleches/app/src/main/AndroidManifest.xml')
          s=manifest.read_text(encoding='utf-8')
          s=s.replace('android:allowBackup="false"','android:allowBackup="false" android:extractNativeLibs="true"')
          manifest.write_text(s,encoding='utf-8')
          # Optional Patricia 5.1 engine for the exclusive FOU style; otherwise Stockfish 19.
          change(app,'private BoardVision vision;private Chess.Board game;private StockfishEngine engine;',
                 'private BoardVision vision;private Chess.Board game;private StockfishEngine engine;private StockfishEngine patricia;private String activeEngine="Stockfish 19";', 'dual engines')
          change(app,'new Thread(()->engine.warmup(),"stockfish-init").start();game=Chess.initial();',
                 'new Thread(()->engine.warmup(),"stockfish-init").start();patricia=new StockfishEngine(getApplicationInfo().nativeLibraryDir+"/libpatricia.so");new Thread(()->{if(new java.io.File(getApplicationInfo().nativeLibraryDir+"/libpatricia.so").isFile())patricia.warmup();},"patricia-init").start();game=Chess.initial();', 'patricia init')
          change(app,'List<TacticalEngine.Suggestion> top=engine.analyze(game,styles,1,85,effort);',
                 'StockfishEngine chosen=(styles.size()==1&&styles.contains(StyleMode.FOU)&&patricia!=null&&patricia.ready())?patricia:engine;\n      List<TacticalEngine.Suggestion> top=chosen.analyze(game,styles,1,85,effort);\n      if(top.isEmpty()&&chosen!=engine){chosen=engine;top=engine.analyze(game,styles,1,85,effort);}\n      activeEngine=chosen==engine?"Stockfish 19":"Patricia 5.1";', 'select engine')
          change(app,'" · Stockfish 19");', '" · "+activeEngine);', 'active name')
          change(app,'if(engine!=null)engine.close();if(thread!=null)',
                 'if(engine!=null)engine.close();if(patricia!=null)patricia.close();if(thread!=null)', 'close both engines')
          print('V8 engines and low-latency capture patches applied')
          PYV8
          echo 'Verify extracted Stockfish binary and Java source'
          test -s ChessFleches/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          test -s ChessFleches/app/src/main/java/fr/chessfleches/StockfishEngine.java

      - name: Detection automatique du coup adverse et fleche immediate V9
        shell: bash
        run: |
          python3 - <<'PYV9'
          from pathlib import Path
          
          root=Path('ChessFleches/app/src/main/java/fr/chessfleches')
          p=root/'CaptureService.java'
          s=p.read_text(encoding='utf-8')
          old='''        if(after!=null&&vision.positionMatches(image,after,white)){
                    lostFrames=0;
                    String uci=Chess.uci(next);
                    if(uci.equals(pending))same++;else{pending=uci;same=1;}
                    if(same>=2){game=after;pending="";same=0;}
                    overlay.show(vision.board(),new ArrayList<>(),white);
                    overlay.status("Verification du coup · analyse actualisee");
                    return;
                  }
                  pending="";same=0;
                  overlay.show(vision.board(),new ArrayList<>(),white);
                  overlay.status("Position differente · resynchronisation");
                  if(++lostFrames>=3)resetSession();
                  return;
          '''
          new='''        if(after!=null&&vision.positionMatches(image,after,white)){
                    // The legal opponent move is already confirmed by the *current* pixels.
                    // Commit in this very frame and calculate the reply below: no second
                    // snapshot / extra wait needed for live, short-time-control chess.
                    game=after;
                    lostFrames=0;pending="";same=0;analyzed="";
                  }else{
                    pending="";same=0;
                    overlay.show(vision.board(),new ArrayList<>(),white);
                    overlay.status("Position differente · resynchronisation");
                    if(++lostFrames>=3)resetSession();
                    return;
                  }
          '''
          assert s.count(old)==1, 'Expected V8 code anchor missing (opponent move sync)'
          s=s.replace(old,new,1)
          # Lower time between samples while keeping at least one Android display refresh
          # with the arrows hidden, so the capture doesn't include our own overlay.
          old='''      if(running)worker.postDelayed(this::sample,65);
              },35);'''
          new='''      if(running)worker.postDelayed(this::sample,20);
              },24);'''
          assert s.count(old)==1, 'Expected V8 sample cadence missing'
          s=s.replace(old,new,1)
          # Avoid frame starvation waiting for second identical screenshot during startup.
          # The first read has already been checked against silhouettes and king constraints.
          # Keep the startup stabilizer (2 consistent reads), because false initial recognition
          # is a bigger risk than tens of ms during the very first calibration.
          
          # Analyze exactly once as soon as current image is confirmed with the new turn.
          assert 'game=after;\n          lostFrames=0;' in s
          p.write_text(s,encoding='utf-8')
          print('V9: live automatic response without extra captured frame; no tap necessary')
          PYV9

