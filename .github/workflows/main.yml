name: Compiler Chess Fleches V4
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  construire-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK officiel
        shell: bash
        run: |
          set -e
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      - name: Decompresser le projet
        run: unzip -q ChessFleches_v2_Projet_GitHub.zip

      - name: Corriger le cadre vert et les fleches
        shell: bash
        run: |
          python3 - <<'PYFIX'
          #!/usr/bin/env python3
          """Chess Fleches: fix board validation, overlay offset and stale arrows."""
          from pathlib import Path

          src = Path('ChessFleches/app/src/main/java/fr/chessfleches')

          def read(name):
              return (src / name).read_text(encoding='utf-8')

          def write(name, data):
              (src / name).write_text(data, encoding='utf-8')

          def once(data, old, new, name):
              if data.count(old) != 1:
                  raise RuntimeError('Expected one patch anchor in '+name+': '+repr(old[:80]))
              return data.replace(old, new, 1)

          v = read('BoardVision.java')
          start = v.index('  private Box fullWidth(Bitmap image){')
          end = v.index('  public Box detectOnScreen(Bitmap image){', start)
          v = v[:start] + '''
            private static double boardColorDistance(int color,double[] bg){
              double r=channel(color,16)-bg[0],g=channel(color,8)-bg[1],b=channel(color,0)-bg[2];
              return Math.sqrt((r*r+g*g+b*b)/3.0);
            }
            /** Only accept a real, correctly aligned 8x8 Chess Universe checkerboard. */
            private static int matchingSquares(Bitmap image,int y,int size){
              int matches=0;
              double sq=size/8.0;
              double[][] corners={{.16,.18},{.84,.18},{.16,.82},{.84,.82}};
              for(int r=0;r<8;r++)for(int c=0;c<8;c++){
                int close=0;
                double[] bg=BG[(r+c)&1];
                for(double[] pt:corners){
                  int x=(int)Math.round((c+pt[0])*sq);
                  int yy=(int)Math.round(y+(r+pt[1])*sq);
                  if(boardColorDistance(pixel(image,x,yy),bg)<44)close++;
                }
                if(close>=3)matches++;
              }
              return matches;
            }
            private Box fullWidth(Bitmap image){
              int w=image.getWidth(),h=image.getHeight();
              if(w<280||h<w+8)return null;
              int size=w,hi=h-size;
              double best=-1;int bestY=-1;
              int[] xs=new int[8];
              for(int c=0;c<8;c++)xs[c]=(int)((c+.14)*size/8);
              for(int y=0;y<=hi;y+=2){
                if(matchingSquares(image,y,size)<52)continue;
                double score=0;
                for(int r=0;r<=8;r++){
                  int yy=y+(int)(r*size/8.0);
                  for(int c=0;c<8;c++)
                    score+=diff(pixel(image,xs[c],yy-2),pixel(image,xs[c],yy+2));
                }
                if(score>best){best=score;bestY=y;}
              }
              return best>1300?new Box(0,bestY,size):null;
            }
          ''' + v[end:]
          v = once(v, '  public Box board(){return board;}',
                   '  public Box board(){return board;}\n  public void align(Box visible){if(visible!=null)board=visible;}',
                   'BoardVision.java')
          v = once(v, '    Box value=fullWidth(small);\n    if(small!=image)small.recycle();',
                   '    Box value=fullWidth(small);\n    int smallHeight=small.getHeight();\n    if(small!=image)small.recycle();',
                   'BoardVision.java')
          v = once(v, '    return new Box(0,(int)Math.round(value.y*(h/(double)(h/scale))),w);',
                   '    return new Box(0,(int)Math.round(value.y*(h/(double)smallHeight)),w);',
                   'BoardVision.java')
          write('BoardVision.java', v)

          c = read('CaptureService.java')
          c = once(c, '  private void process(Bitmap image){\n    if(!vision.calibrated()){', '''  private void process(Bitmap image){
              BoardVision.Box visible=vision.detectOnScreen(image);
              if(visible==null){
                vision.reset();game=null;scanPending="";scanSame=0;
                pending="";same=0;analyzed="";arrows.clear();
                overlay.show(null,new ArrayList<>(),white);
                overlay.status("Aucun echiquier detecte");
                return;
              }
              if(!vision.calibrated()){''', 'CaptureService.java')
          c = once(c, '      BoardVision.Box rect=vision.detectOnScreen(image);',
                   '      BoardVision.Box rect=visible;', 'CaptureService.java')
          c = once(c, '    }else{\n      Chess.Move next=vision.detectMove(image,game,white);',
                   '    }else{\n      vision.align(visible);\n      Chess.Move next=vision.detectMove(image,game,white);',
                   'CaptureService.java')
          write('CaptureService.java', c)

          o = read('OverlayUI.java')
          o = once(o, '      int n=Math.min(5,suggestions.size());float sz=board.size/8f;', '''      // Convert screen coordinates to overlay-view coordinates.
                int[] screenOrigin=new int[2];
                getLocationOnScreen(screenOrigin);
                float left=board.x-screenOrigin[0],top=board.y-screenOrigin[1];
                int n=Math.min(5,suggestions.size());float sz=board.size/8f;''', 'OverlayUI.java')
          o = once(o, '        float x=board.x+(fromC+.5f)*sz,y=board.y+(fromR+.5f)*sz;',
                   '        float x=left+(fromC+.5f)*sz,y=top+(fromR+.5f)*sz;', 'OverlayUI.java')
          o = once(o, '        float tx=board.x+(toC+.5f)*sz,ty=board.y+(toR+.5f)*sz;',
                   '        float tx=left+(toC+.5f)*sz,ty=top+(toR+.5f)*sz;', 'OverlayUI.java')
          o = once(o, '      canvas.drawRect(new RectF(board.x,board.y,board.x+board.size,board.y+board.size),p);',
                   '      canvas.drawRect(new RectF(left,top,left+board.size,top+board.size),p);', 'OverlayUI.java')
          write('OverlayUI.java', o)
          print('Patch applied')
          PYFIX

      - name: Reconnaissance automatique V4
        shell: bash
        run: |
          python3 - <<'PYV4'
          from pathlib import Path
          src=Path('ChessFleches/app/src/main/java/fr/chessfleches')
          p=src/'BoardVision.java'
          v=p.read_text(encoding='utf-8')
          start=v.index('  /** Reconstruit les pieces depuis l\'image') if '  /** Reconstruit les pieces depuis l\'image' in v else v.index('  /** Reconstruit les pièces depuis l\'image')
          end=v.index('  /** Apprentissage de ce qui est reconnu',start)
          replacement='''  /** Locate the precise first row, correcting detector rounding. */
            private Box refineTop(Bitmap image,Box coarse){
              double best=-1e10; int bestY=coarse.y;
              double sq=coarse.size/8.0;
              for(int y=Math.max(3,coarse.y-7);y<=Math.min(image.getHeight()-coarse.size-3,coarse.y+7);y++){
                double quality=0;
                for(int c=0;c<8;c++){
                  int x=(int)Math.round((c+.5)*sq);
                  double[] expect=BG[c&1];
                  quality+=boardColorDistance(pixel(image,x,y-2),expect)
                          -boardColorDistance(pixel(image,x,y+2),expect);
                }
                quality+=.02*y;
                if(quality>best){best=quality;bestY=y;}
              }
              return new Box(coarse.x,bestY,coarse.size);
            }
            /** Compare piece silhouette against the local square color. */
            private double[] appearance(Bitmap image,Box b,int r,int c){
              double sq=b.size/8.0;
              double[][] corners={{.07,.07},{.93,.07},{.07,.93},{.93,.93}};
              double[][] channels=new double[3][4];
              for(int k=0;k<4;k++){
                int x=(int)Math.round(b.x+(c+corners[k][0])*sq);
                int y=(int)Math.round(b.y+(r+corners[k][1])*sq);
                int color=pixel(image,x,y);
                channels[0][k]=channel(color,16);channels[1][k]=channel(color,8);
                channels[2][k]=channel(color,0);
              }
              double[] bg=new double[3];
              for(int j=0;j<3;j++){
                java.util.Arrays.sort(channels[j]);
                bg[j]=(channels[j][1]+channels[j][2])/2;
              }
              int foreground=0,pureWhite=0;
              final int samples=14;
              for(int yy=0;yy<samples;yy++)for(int xx=0;xx<samples;xx++){
                double u=.19+.62*(xx+.5)/samples,v=.19+.62*(yy+.5)/samples;
                int x=(int)Math.round(b.x+(c+u)*sq),y=(int)Math.round(b.y+(r+v)*sq);
                int color=pixel(image,x,y);
                double R=channel(color,16),G=channel(color,8),B=channel(color,0);
                double d=Math.sqrt(((R-bg[0])*(R-bg[0])+(G-bg[1])*(G-bg[1])+(B-bg[2])*(B-bg[2]))/3.0);
                if(d>44)foreground++;
                if(R>240&&G>245&&B>245)pureWhite++;
              }
              return new double[]{foreground/(double)(samples*samples),pureWhite/(double)(samples*samples)};
            }
            private int pieceCandidate(double[] s,boolean white,int row,boolean excludeKing,boolean excludePawn){
              int from=white?1:7,to=white?6:12;
              double best=Double.POSITIVE_INFINITY;int result=0;
              for(int k=from;k<=to;k++){
                char p=Character.toLowerCase(TYPES[k]);
                if(excludeKing&&p=='k')continue;
                if(excludePawn&&p=='p')continue;
                if(p=='p'&&(row==0||row==7))continue;
                if(s[k]<best){best=s[k];result=k;}
              }
              return result;
            }
            private Chess.Board recognize(Bitmap image,Box rect,boolean whiteBottom,boolean whiteToMove){
              board=rect;
              double[][] scores=readCosts(image);
              Chess.Board found=new Chess.Board();found.whiteTurn=whiteToMove;
              found.rights=0;found.ep=-1;
              boolean[] filled=new boolean[64],isWhite=new boolean[64];
              int pieces=0,whites=0,blacks=0;
              int[] fallback=new int[64];
              for(int r=0;r<8;r++)for(int c=0;c<8;c++){
                int i=r*8+c,square=internal(r,c,whiteBottom);
                double[] a=appearance(image,rect,r,c);
                boolean present=a[0]>=.12;
                if(!present){found.b[square]='.';continue;}
                boolean white=a[1]>.11;
                filled[i]=true;isWhite[i]=white;pieces++;
                if(white)whites++;else blacks++;
                int kind=pieceCandidate(scores[i],white,r,true,false);
                fallback[i]=kind;
                found.b[square]=TYPES[kind];
              }
              if(pieces<4||pieces>32||whites==0||blacks==0||whites>16||blacks>16)return null;
              for(int side=0;side<2;side++){
                boolean white=side==0;int kingType=white?6:12;
                int selected=-1;double best=Double.POSITIVE_INFINITY;
                for(int i=0;i<64;i++){
                  if(!filled[i]||isWhite[i]!=white)continue;
                  double cost=scores[i][kingType]-scores[i][fallback[i]];
                  if(cost<best){best=cost;selected=i;}
                }
                if(selected<0)return null;
                found.b[internal(selected/8,selected%8,whiteBottom)]=TYPES[kingType];
              }
              for(int side=0;side<2;side++){
                boolean white=side==0;char pawn=white?'P':'p';int pawnType=white?1:7;
                while(true){
                  int n=0,worst=-1;double leastPenalty=Double.NEGATIVE_INFINITY;
                  for(int i=0;i<64;i++){
                    int square=internal(i/8,i%8,whiteBottom);
                    if(found.b[square]!=pawn)continue;
                    n++;
                    int alternative=pieceCandidate(scores[i],white,i/8,true,true);
                    double penalty=scores[i][alternative]-scores[i][pawnType];
                    if(penalty>leastPenalty){leastPenalty=penalty;worst=i;}
                  }
                  if(n<=8)break;
                  if(worst<0)return null;
                  int alt=pieceCandidate(scores[worst],white,worst/8,true,true);
                  found.b[internal(worst/8,worst%8,whiteBottom)]=TYPES[alt];
                }
              }
              return Chess.plausible(found)?found:null;
            }
            /** Recover live games already in progress without a manual FEN. */
            public Chess.Board scanPosition(Bitmap image,Box rect,boolean whiteBottom,boolean whiteToMove){
              if(rect==null)return null;
              Box fine=refineTop(image,rect);
              int[] offsets={0,-1,1,-2,2,-3,3};
              for(int offset:offsets){
                int y=fine.y+offset;
                if(y<0||y+fine.size>image.getHeight())continue;
                Box sample=new Box(fine.x,y,fine.size);
                Chess.Board candidate=recognize(image,sample,whiteBottom,whiteToMove);
                if(candidate!=null){board=sample;return candidate;}
              }
              board=null;
              return null;
            }
          '''
          v=v[:start]+replacement+v[end:]
          p.write_text(v,encoding='utf-8')

          p=src/'CaptureService.java'
          c=p.read_text(encoding='utf-8')
          old='game=scanned;vision.calibrate(image,rect,game,white);'
          new='game=scanned;vision.calibrate(image,vision.board()!=null?vision.board():rect,game,white);'
          assert c.count(old)==1,('expected calibrate anchor', c.count(old))
          p.write_text(c.replace(old,new),encoding='utf-8')
          print('V4 recognition patch complete')
          PYV4

      - name: Compiler APK
        working-directory: ChessFleches
        run: gradle :app:assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessFleches-V4-APK
          path: ChessFleches/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
