name: Compiler Chess Fleches V2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  construire-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparer Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Decompresser le projet
        run: unzip -q ChessFleches_v2_Projet_GitHub.zip
      - name: Compiler APK
        working-directory: ChessFleches
        run: gradle :app:assembleDebug --no-daemon
      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessFleches-V2-APK
          path: ChessFleches/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
